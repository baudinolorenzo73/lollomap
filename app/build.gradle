plugins {
    id 'com.android.application'
}

// Firma di rilascio: crea il file keystore.properties nella cartella del progetto
// (non va mai pubblicato) con storeFile, storePassword, keyAlias, keyPassword.
def firma = new Properties()
def fileFirma = rootProject.file('keystore.properties')
if (fileFirma.exists()) { fileFirma.withInputStream { firma.load(it) } }

android {
    namespace 'it.lollo.stampamappe'
    compileSdk 35

    defaultConfig {
        applicationId 'it.lollo.stampamappe'
        minSdk 24
        targetSdk 35
        versionCode 430
        versionName '4.3.0'
    }

    signingConfigs {
        if (fileFirma.exists()) {
            rilascio {
                storeFile file(firma['storeFile'])
                storePassword firma['storePassword']
                keyAlias firma['keyAlias']
                keyPassword firma['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (fileFirma.exists()) signingConfig signingConfigs.rilascio
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
}
